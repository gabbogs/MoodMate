# JVM Arguments: Increase memory allocation for Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Enable Gradle daemon for faster builds
org.gradle.daemon=true
# Enable parallel execution (faster builds with multi-core CPUs)
org.gradle.parallel=true
# Enable build cache (reuses outputs from previous builds)
org.gradle.caching=true
# Reduce the number of Gradle workers to match the number of CPU cores
org.gradle.workers.max=4
# Enable configuration on demand to speed up project configuration
org.gradle.configureondemand=true
# Use AndroidX
android.useAndroidX=true
# Optimize Kotlin compilation
kotlin.code.style=official
# Enable namespacing for R classes to reduce APK size
android.nonTransitiveRClass=true
